appId: ${MAESTRO_APP_ID}
name: Create and verify an Android contact
tags:
  - android
  - android-default
env:
  FIRST_NAME: ${faker.name().firstName()}
  LAST_NAME: ${faker.name().lastName()}
  PHONE_NUMBER: ${faker.number().digits(10)}
---
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: ".*floating_action_button.*"
- tapOn:
    id: ".*floating_action_button.*"
- assertVisible: "Name"
- tapOn: "Name"
- inputText: ${FIRST_NAME}
- tapOn: "Company"
- inputText: ${LAST_NAME}
- hideKeyboard
- tapOn:
    text: "+62"
    point: "80%,50%"
- inputText: ${PHONE_NUMBER}
- tapOn: ".*Save.*"
- assertVisible: ${FIRST_NAME}
- assertVisible: ${LAST_NAME}
- assertVisible: ".*\\+62.*"
- assertVisible: "Mobile"
